name: Copia de seguridad

# Cada semana exporta la base de datos de producción (D1), la cifra con
# BACKUP_PASSPHRASE y la guarda como artefacto del run durante 90 días. Cómo
# restaurarla: README, «Copias de seguridad».
on:
  schedule:
    # Lunes a las 03:30 UTC, cuando menos se juega. La exportación bloquea la base unos segundos.
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Comprobar los secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID o BACKUP_PASSPHRASE en Settings > Secrets and variables > Actions"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exportar la base de datos
        run: |
          echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
          pnpm exec wrangler d1 export skid --remote --output skid.sql
      # Una copia vacía o a medias no sirve: mejor que el run salga en rojo.
      - name: Comprobar la copia
        run: |
          grep -q '^CREATE TABLE players' skid.sql || { echo "::error::La copia no tiene la tabla players"; exit 1; }
          grep -q 'd1_migrations' skid.sql || { echo "::error::La copia no tiene las migraciones"; exit 1; }
          {
            echo "### Copia de $(date -u +%F)"
            echo "- Tamaño: $(du -h skid.sql | cut -f1)"
            echo "- Tablas: $(grep -c '^CREATE TABLE' skid.sql)"
            echo "- Filas: $(grep -c '^INSERT INTO' skid.sql)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cifrar
        run: |
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback --passphrase-fd 0 --output "skid-$DAY.sql.gpg" skid.sql
          rm skid.sql
      - uses: actions/upload-artifact@v7
        with:
          name: skid-${{ env.DAY }}
          path: skid-${{ env.DAY }}.sql.gpg
          retention-days: 90
          # Ya va cifrado: comprimirlo no gana nada.
          compression-level: 0
          if-no-files-found: error
