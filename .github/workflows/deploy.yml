name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# El token de GitHub del workflow solo puede leer el código (no escribir ni tocar nada más).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Entorno de GitHub: cada despliegue queda en «Deployments» con el enlace al juego.
    environment:
      name: production
      url: https://skid.gpm-854.workers.dev
    env:
      # Secrets del repositorio (Settings > Secrets and variables > Actions).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Con el lockfile tal cual; los scripts de instalación permitidos están en pnpm-workspace.yaml.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
      # Sin los secrets el despliegue falla (antes se saltaba y el run salía en verde sin publicar nada).
      - name: Comprobar los secrets de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions"
            exit 1
          fi
      - run: pnpm exec wrangler d1 migrations apply skid --remote
      - run: pnpm exec wrangler deploy
