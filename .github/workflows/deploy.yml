name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# El token de GitHub del workflow solo puede leer el código (no escribir ni tocar nada más).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets del repositorio (Settings > Secrets and variables > Actions).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Sin los secrets el despliegue falla (antes se saltaba y el run salía en verde sin publicar nada).
      - name: Comprobar los secrets de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions"
            exit 1
          fi
      - run: npx wrangler d1 migrations apply skid --remote
      - run: npx wrangler deploy
